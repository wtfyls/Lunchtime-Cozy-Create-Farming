name: Feature request
description: Suggest an improvement for Lunchtime
title: "[Suggestion]: "
body:
  - type: markdown
    attributes:
      value: "Suggestions are reviewed against Lunchtime's cozy, multiplayer-friendly direction, compatibility, and performance goals."
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature, mod, quest, or improvement.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this improve Lunchtime?
      description: Explain the player benefit and the problem it solves.
    validations:
      required: true
  - type: input
    id: project-link
    attributes:
      label: Relevant project link (if applicable)
      placeholder: "Official mod or resource page"
    validations:
      required: false
  - type: textarea
    id: concerns
    attributes:
      label: Compatibility or performance notes
      description: Mention known requirements, overlap, server-side behavior, or performance concerns.
    validations:
      required: false
